[project]
name = "dialtone"
version = "0.1.0"
description = "A voice-agent platform whose turn-taking model is measured, not asserted."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tasnimul Hasan" }]
keywords = ["voice-ai", "turn-taking", "endpointing", "barge-in", "telephony"]

dependencies = ["numpy>=1.26", "pydantic>=2.7", "typer>=0.12"]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "websockets>=12.0", "httpx>=0.27"]
# The local brain and the local voice. Both optional: the platform runs without them,
# reports which engines are loaded, and the studio says so rather than failing quietly.
brain = ["torch>=2.2", "transformers>=4.44"]
voice = ["kokoro-onnx>=0.4", "onnxruntime>=1.17", "soundfile>=0.12"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
dialtone = "dialtone.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dialtone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/dialtone/cli.py" = ["B008"]

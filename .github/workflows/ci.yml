name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The embedding model's weights, not the code. Downloading 130MB of bge-small on every
      # run is slow and is the only part of this job that can fail for reasons unrelated to the
      # commit.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5

      # Torch from the CPU index. The default wheel pulls the whole CUDA stack — around 800MB —
      # and there is no GPU on a runner to use it.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # `brain` is included deliberately. Retrieval quality is a headline claim of this project,
      # and the relevance gate is tuned to measured cosine distances, so a CI run that skips the
      # encoder is not checking the thing most likely to regress.
      - run: pip install -e ".[serve,brain,dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest -q

      # The benchmark is part of CI on purpose. It is the headline claim of the project, so a
      # change that quietly regresses it should fail the build rather than be discovered in a
      # README that no longer matches the code.
      - name: the headline result still holds
        run: |
          python - <<'PY'
          from dialtone.eval.endpointing import ablate
          results = {r.label: r for r in ablate()}
          best = results["+ both (default)"]
          baseline = results["baseline fixed 700ms"]

          assert best.false_cutoff_rate == 0.0, (
              f"the default configuration now talks over {best.false_cutoff_rate:.1%} of "
              f"unfinished turns"
          )
          assert best.completion_recall == 1.0, "it no longer answers every finished turn"
          assert best.median_latency_ms < baseline.median_latency_ms / 2, (
              f"the speedup fell to {baseline.median_latency_ms / best.median_latency_ms:.2f}x"
          )
          print(
              f"ok: {best.median_latency_ms:.0f}ms median, "
              f"{best.false_cutoff_rate:.1%} false cutoff, "
              f"{baseline.median_latency_ms / best.median_latency_ms:.1f}x vs baseline"
          )
          PY

      - name: every scenario still runs end to end
        run: python -m dialtone.cli call run all

  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
